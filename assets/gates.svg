<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#5ee698"/></marker></defs><rect width="100%" height="100%" fill="#0b1c13" rx="14"/><style>text{font-family:monospace;fill:#edf2e9;font-size:13px}.sub{fill:#a3b7a9;font-size:12px}.box{fill:#112b1d;stroke:#537447;stroke-width:1.5}.wire{fill:none;stroke:#5ee698;stroke-width:2;marker-end:url(#a)}</style><text x="28" y="35">SEQUENCE CIRCUIT / SHARED PRODUCT TERMS</text><rect class="box" x="25" y="75" width="250" height="70" rx="9"/><text x="43" y="105">T0 = NOT Q1 · NOT Q0 · I10</text><text class="sub" x="43" y="128">AND: first correct key</text><rect class="box" x="25" y="175" width="250" height="70" rx="9"/><text x="43" y="205">T1 = NOT Q1 · Q0 · I6</text><text class="sub" x="43" y="228">AND: second correct key</text><rect class="box" x="25" y="275" width="250" height="70" rx="9"/><text x="43" y="305">T2 = Q1 · NOT Q0 · I9</text><text class="sub" x="43" y="328">AND: final correct key</text><rect class="box" x="405" y="105" width="175" height="70" rx="9"/><text x="423" y="135">D0 = T0 OR T2</text><text class="sub" x="423" y="158">OR gate</text><rect class="box" x="405" y="255" width="175" height="70" rx="9"/><text x="423" y="285">D1 = T1 OR T2</text><text class="sub" x="423" y="308">OR gate</text><rect class="box" x="680" y="105" width="130" height="70" rx="9"/><text x="698" y="135">D FF 0</text><text class="sub" x="698" y="158">Q0</text><rect class="box" x="680" y="255" width="130" height="70" rx="9"/><text x="698" y="285">D FF 1</text><text class="sub" x="698" y="308">Q1</text><path class="wire" d="M275 110H350V130H403"/><path class="wire" d="M275 210H335V280H403"/><path class="wire" d="M275 310H320V155H403"/><path class="wire" d="M320 310H403"/><path class="wire" d="M580 140H678"/><path class="wire" d="M580 290H678"/><path class="wire" d="M810 140H865V195H890"/><path class="wire" d="M810 290H865V225H890"/><path class="box" d="M892 180H925A30 30 0 0 1 925 240H892Z"/><text class="sub" x="897" y="214">AND</text><text x="855" y="270">Green</text><text class="sub" x="28" y="390">Q feedback feeds T0, T1 and T2. Common key edge clocks both registers; Reset clears both.</text></svg>