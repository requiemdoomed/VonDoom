<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#5ee698"/></marker></defs><rect width="100%" height="100%" fill="#0b1c13" rx="14"/><style>text{font-family:monospace;fill:#edf2e9;font-size:15px}.sub{fill:#a3b7a9;font-size:12px}.box{fill:#112b1d;stroke:#537447;stroke-width:1.5}.wire{fill:none;stroke:#5ee698;stroke-width:2;marker-end:url(#a)}</style><text x="30" y="34">CONTROL PLANE / LOCAL PYTHON PROCESS</text><rect class="box" x="30" y="75" width="230" height="85" rx="9"/><text x="48" y="105">BROWSER CONSOLE</text><text class="sub" x="48" y="128">PIN entry + status display</text><rect class="box" x="340" y="75" width="290" height="85" rx="9"/><text x="358" y="105">HTTP REQUEST BOUNDARY</text><text class="sub" x="358" y="128">Host / origin / token / JSON</text><rect class="box" x="340" y="220" width="290" height="85" rx="9"/><text x="358" y="250">ACCESS CONTROLLER</text><text class="sub" x="358" y="273">verify / lockout / auto-lock</text><rect class="box" x="710" y="75" width="255" height="85" rx="9"/><text x="728" y="105">SQLITE STORAGE</text><text class="sub" x="728" y="128">salt + verifier + event log</text><rect class="box" x="710" y="220" width="255" height="85" rx="9"/><text x="728" y="250">PROTECTED RESPONSE</text><text class="sub" x="728" y="273">requires open access window</text><path class="wire" d="M260 117H338"/><path class="wire" d="M485 160V218"/><path class="wire" d="M630 247H675V118H708"/><path class="wire" d="M630 270H708"/><rect class="box" x="30" y="220" width="230" height="85" rx="9"/><text x="48" y="250">SEPARATE LOGIC LAB</text><text class="sub" x="48" y="273">public keys / two-bit FSM</text><text class="sub" x="30" y="350">Lab events never authorize access. The browser cannot override Python lock state.</text><text class="sub" x="30" y="377">The OS account is trusted. This is a local software model; no physical actuator is attached.</text></svg>